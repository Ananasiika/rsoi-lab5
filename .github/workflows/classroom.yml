name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev
jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.x'

      - name: Install jq for JSON parsing
        run: sudo apt-get install -y jq

      - name: Install dependencies
        run: |
          dotnet restore ./src/BonusService/BonusService.csproj
          dotnet restore ./src/FlightService/FlightService.csproj
          dotnet restore ./src/TicketService/TicketService.csproj
          dotnet restore ./src/GatewayService/GatewayService.csproj

      - name: Build
        run: |
          dotnet publish ./src/BonusService/BonusService.csproj -c Release
          dotnet publish ./src/FlightService/FlightService.csproj -c Release
          dotnet publish ./src/TicketService/TicketService.csproj -c Release
          dotnet publish ./src/GatewayService/GatewayService.csproj -c Release

      - name: Run Tests
        run: dotnet test ./src

      - name: Build images
        timeout-minutes: 10
        run: docker compose build

      - name: Run containers
        timeout-minutes: 10
        run: |
          docker compose up -d
          echo "Waiting for services to start..."
          sleep 30
          
          # Показываем логи Keycloak для диагностики
          echo "=== Keycloak logs ==="
          docker compose logs keycloak || true
          
          # Проверяем статус контейнеров
          echo "=== Container status ==="
          docker compose ps
          
          # Пробуем запустить Keycloak снова если упал
          docker compose up -d keycloak
          sleep 10
          docker compose logs keycloak
          
          # Запускаем настройку только если Keycloak жив
          if docker compose ps keycloak | grep -q "Up"; then
            chmod +x ./keycloak-setup.sh
            ./keycloak-setup.sh
            ./scripts/wait-script.sh
          else
            echo "Keycloak failed to start. Check configuration."
            exit 1
          fi
        env:
          WAIT_PORTS: 8080,8070,8060,8050,8081
          
      - name: Run API Tests
        uses: matt-ball/newman-action@master
        with:
          collection: v1/postman/collection.json
          environment: v1/postman/environment.json
          delayRequest: 100
          reporters: '[ "cli" ]'
          
      - uses: education/autograding@v1
        id: autograder
        continue-on-error: true

      - name: Stop containers
        if: always()
        continue-on-error: true
        run: docker compose down -v